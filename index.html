<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1024 数字合并游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 20px;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
        }
        
        .score {
            color: #667eea;
        }
        
        .best {
            color: #764ba2;
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            background: #bbada0;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 25px;
        }
        
        .cell {
            width: 100%;
            aspect-ratio: 1;
            background: rgba(238, 228, 218, 0.35);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8em;
            font-weight: bold;
            color: #776e65;
            transition: all 0.15s ease;
        }
        
        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 1.6em; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 1.6em; }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 1.6em; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 1.4em; }
        .tile-2048 { background: #edc22e; color: #f9f6f2; font-size: 1.4em; }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .new-game {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }
        
        .new-game:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .undo {
            background: #f8f9fa;
            color: #333;
            border: 2px solid #ddd;
        }
        
        .undo:hover {
            background: #e9ecef;
            transform: translateY(-2px);
        }
        
        .instructions {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .instructions h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.2em;
        }
        
        .instructions ul {
            list-style-type: none;
            padding-left: 0;
        }
        
        .instructions li {
            margin-bottom: 8px;
            color: #666;
            line-height: 1.5;
        }
        
        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .game-over.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .game-over-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        .game-over h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
        }
        
        .game-over p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
            line-height: 1.6;
        }
        
        .restart-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        @media (max-width: 480px) {
            .game-container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            .stats {
                flex-direction: column;
                gap: 15px;
            }
            
            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>1024 数字合并游戏</h1>
            <p class="subtitle">滑动合并相同的数字，目标：1024！</p>
        </div>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-label">当前分数</div>
                <div class="stat-value score" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">最高分</div>
                <div class="stat-value best" id="best">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">移动次数</div>
                <div class="stat-value" id="moves">0</div>
            </div>
        </div>
        
        <div class="game-board" id="board">
            <!-- 游戏格子将通过JavaScript生成 -->
        </div>
        
        <div class="controls">
            <button class="new-game" onclick="newGame()">新游戏</button>
            <button class="undo" onclick="undoMove()">撤销</button>
        </div>
        
        <div class="instructions">
            <h3>游戏说明：</h3>
            <ul>
                <li>使用 <strong>方向键</strong> 或 <strong>WASD</strong> 控制方块移动</li>
                <li>相同数字的方块碰撞时会合并成它们的和</li>
                <li>每次移动后会在空白处随机生成一个2或4</li>
                <li>目标：合并出 <strong>1024</strong>！</li>
                <li>当棋盘填满且无法移动时游戏结束</li>
            </ul>
        </div>
    </div>
    
    <div class="game-over" id="gameOver">
        <div class="game-over-content">
            <h2 id="gameOverTitle">游戏结束！</h2>
            <p id="gameOverMessage">棋盘已满，无法继续移动。</p>
            <button class="restart-btn" onclick="newGame()">重新开始</button>
        </div>
    </div>

    <script>
        // 游戏状态
        let board = [];
        let score = 0;
        let bestScore = localStorage.getItem('1024-best-score') || 0;
        let moves = 0;
        let history = [];
        let gameOver = false;
        
        // 初始化游戏
        function initGame() {
            board = Array(4).fill().map(() => Array(4).fill(0));
            score = 0;
            moves = 0;
            history = [];
            gameOver = false;
            
            document.getElementById('score').textContent = '0';
            document.getElementById('best').textContent = bestScore;
            document.getElementById('moves').textContent = '0';
            document.getElementById('gameOver').classList.remove('active');
            
            // 生成初始的两个数字
            addRandomTile();
            addRandomTile();
            
            renderBoard();
        }
        
        // 添加随机数字
        function addRandomTile() {
            const emptyCells = [];
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (board[i][j] === 0) {
                        emptyCells.push({i, j});
                    }
                }
            }
            
            if (emptyCells.length > 0) {
                const cell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                board[cell.i][cell.j] = Math.random() < 0.9 ? 2 : 4;
            }
        }
        
        // 渲染游戏板
        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    const value = board[i][j];
                    if (value > 0) {
                        cell.textContent = value;
                        cell.classList.add(`tile-${value}`);
                    }
                    
                    boardElement.appendChild(cell);
                }
            }
        }
        
        // 保存历史状态
        function saveHistory() {
            history.push({
                board: board.map(row => [...row]),
                score: score,
                moves: moves
            });
            
            // 只保留最近10步历史
            if (history.length > 10) {
                history.shift();
            }
        }
        
        // 移动数字
        function move(direction) {
            if (gameOver) return false;
            
            saveHistory();
            
            let moved = false;
            const oldBoard = board.map(row => [...row]);
            
            switch(direction) {
                case 'up':
                    moved = moveUp();
                    break;
                case 'down':
                    moved = moveDown();
                    break;
                case 'left':
                    moved = moveLeft();
                    break;
                case 'right':
                    moved = moveRight();
                    break;
            }
            
            if (moved) {
                addRandomTile();
                moves++;
                updateStats();
                renderBoard();
                
                if (checkGameOver()) {
                    endGame(false);
                } else if (checkWin()) {
                    endGame(true);
                }
            }
            
            return moved;
        }
        
        // 向上移动
        function moveUp() {
            let moved = false;
            
            for (let j = 0; j < 4; j++) {
                const column = [];
                for (let i = 0; i < 4; i++) {
                    if (board[i][j] !== 0) {
                        column.push(board[i][j]);
                    }
                }
                
                // 合并相同数字
                for (let i = 0; i < column.length - 1; i++) {
                    if (column[i] === column[i + 1]) {
                        column[i] *= 2;
                        score += column[i];
                        column.splice(i + 1, 1);
                        moved = true;
                    }
                }
                
                // 填充回棋盘
                for (let i = 0; i < 4; i++) {
                    if (i < column.length) {
                        if (board[i][j] !== column[i]) moved = true;
                        board[i][j] = column[i];
                    } else {
                        board[i][j] = 0;
                    }
                }
            }
            
            return moved;
        }
        
        // 向下移动
        function moveDown() {
            let moved = false;
            
            for (let j = 0; j < 4; j++) {
                const column = [];
                for (let i = 3; i >= 0; i--) {
                    if (board[i][j] !== 0) {
                        column.push(board[i][j]);
                    }
                }
                
                // 合并相同数字
                for (let i = 0; i < column.length - 1; i++) {
                    if (column[i] === column[i + 1]) {
                        column[i] *= 2;
                        score += column[i];
                        column.splice(i + 1, 1);
                        moved = true;
                    }
                }
                
                // 填充回棋盘
                for (let i = 3; i >= 0; i--) {
                    const index = 3 - i;
                    if (index < column.length) {
                        if (board[i][j] !== column[index]) moved = true;
                        board[i][j] = column[index];
                    } else {
                        board[i][j] = 0;
                    }
                }
            }
            
            return moved;
        }
        
        // 向左移动
        function moveLeft() {
            let moved = false;
            
            for (let i = 0; i < 4; i++) {
                const row = [];
                for (let j = 0; j < 4; j++) {
                    if (board[i][j] !== 0) {
                        row.push(board[i][j]);
                    }
                }
                
                // 合并相同数字
                for (let j = 0; j < row.length - 1; j++) {
                    if (row[j] === row[j + 1]) {
                        row[j] *= 2;
                        score += row[j];
                        row.splice(j + 1, 1);
                        moved = true;
                    }
                }
                
                // 填充回棋盘
                for (let j = 0; j < 4; j++) {
                    if (j < row.length) {
                        if (board[i][j] !== row[j]) moved = true;
                        board[i][j] = row[j];
                    } else {
                        board[i][j] = 0;
                    }
                }
            }
            
            return moved;
        }
        
        // 向右移动
        function moveRight() {
            let moved = false;
            
            for (let i = 0; i < 4; i++) {
                const row = [];
                for (let j = 3; j >= 0; j--) {
                    if (board[i][j] !== 0) {
                        row.push(board[i][j]);
                    }
                }
                
                // 合并相同数字
                for (let j = 0; j < row.length - 1; j++) {
                    if (row[j] === row[j + 1]) {
                        row[j] *= 2;
                        score += row[j];
                        row.splice(j + 1, 1);
                        moved = true;
                    }
                }
                
                // 填充回棋盘
                for (let j = 3; j >= 0; j--) {
                    const index = 3 - j;
                    if (index < row.length) {
                        if (board[i][j] !== row[index]) moved = true;
                        board[i][j] = row[index];
                    } else {
                        board[i][j] = 0;
                    }
                }
            }
            
            return moved;
        }
        
        // 更新统计信息
        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('moves').textContent = moves;
            
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('1024-best-score', bestScore);
                document.getElementById('best').textContent = bestScore;
            }
        }
        
        // 检查游戏是否结束
        function checkGameOver() {
            // 检查是否有空格
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (board[i][j] === 0) {
                        return false;
                    }
                }
            }
            
            // 检查是否可以合并
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    const value = board[i][j];
                    
                    // 检查右侧
                    if (j < 3 && board[i][j + 1] === value) {
                        return false;
                    }
                    
                    // 检查下方
                    if (i < 3 && board[i + 1][j] === value) {
                        return false;
                    }
                }
            }
            
            return true;
        }
        
        // 检查是否获胜
        function checkWin() {
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (board[i][j] === 1024) {
                        return true;
                    }
                }
            }
            return false;
        }
        
        // 结束游戏
        function endGame(isWin) {
            gameOver = true;
            const gameOverElement = document.getElementById('gameOver');
            const titleElement = document.getElementById('gameOverTitle');
            const messageElement = document.getElementById('gameOverMessage');
            
            if (isWin) {
                titleElement.textContent = '恭喜！你赢了！';
                messageElement.textContent = `你成功合并出了1024！最终得分：${score}`;
            } else {
                titleElement.textContent = '游戏结束！';
                messageElement.textContent = `棋盘已满，无法继续移动。最终得分：${score}`;
            }
            
            gameOverElement.classList.add('active');
        }
        
        // 新游戏
        function newGame() {
            initGame();
        }
        
        // 撤销移动
        function undoMove() {
            if (history.length > 0 && !gameOver) {
                const lastState = history.pop();
                board = lastState.board;
                score = lastState.score;
                moves = lastState.moves;
                
                updateStats();
                renderBoard();
                document.getElementById('gameOver').classList.remove('active');
                gameOver = false;
            }
        }
        
        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (gameOver) return;
            
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    e.preventDefault();
                    move('up');
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    e.preventDefault();
                    move('down');
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault();
                    move('left');
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault();
                    move('right');
                    break;
            }
        });
        
        // 触摸滑动控制
        let touchStartX = 0;
        let touchStartY = 0;
        
        document.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, {passive: true});
        
        document.addEventListener('touchend', (e) => {
            if (gameOver) return;
            
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            const minSwipeDistance = 30;
            
            if (Math.abs(dx) > Math.abs(dy)) {
                // 水平滑动
                if (Math.abs(dx) > minSwipeDistance) {
                    if (dx > 0) {
                        move('right');
                    } else {
                        move('left');
                    }
                }
            } else {
                // 垂直滑动
                if (Math.abs(dy) > minSwipeDistance) {
                    if (dy > 0) {
                        move('down');
                    } else {
                        move('up');
                    }
                }
            }
        }, {passive: true});
        
        // 初始化游戏
        window.onload = initGame;
    </script>
</body>
</html>
